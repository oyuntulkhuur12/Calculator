<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <main class="calculator">
    <button class="clear" data-action="clear" aria-label="Clear">C</button>

    <div class="display" id="display" role="status" aria-live="polite">0</div>

    <div class="keys">
      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button data-op="/" aria-label="Divide">/</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button data-op="×" aria-label="Multiply">×</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button data-op="−" aria-label="Subtract">−</button>

      <button data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button data-op="+" aria-label="Add">+</button>
      <button data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
